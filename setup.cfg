# https://setuptools.pypa.io/en/latest/userguide/declarative_config.html
# https://setuptools.pypa.io/en/latest/references/keywords.html
[metadata]
name = smops
version = attr: smops.VERSION
author = L. Andati
author_email = landati@duck.com
description = Python script for interpolating FITS model images over frequency
long_description = file: README.rst, HISTORY.rst
long_description_content_type = text/x-rst
keywords = smops, model frequency interpolation, FITS images
license = MIT license
license_files = LICENSE
url = https://github.com/ratt-ru/smops
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    Intended Audience :: Science/Research
    License :: OSI Approved :: MIT License
    Natural Language :: English
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13

[options]
python_requires = >=3.9
zip_safe = False
install_requires =
    astropy
    click>=8
    numpy
    psutil

[options.extras_require]
test =
    pytest>=7

[flake8]
exclude = docs

[tool:pytest]
testpaths = tests
